plugins {
    // Upgraded to Spring Boot 3.2.12 (LTS) from the previously pinned,
    // OSS-EOL 2.7.x line as part of the Java version upgrade.
    id 'org.springframework.boot' version '3.2.12'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'java'
    id 'application'
}

application {
    mainClass = "com.amazonaws.samples.S3Sample"
}

springBoot {
    mainClass = "com.amazonaws.samples.OrderServiceApplication"
}

// Upgraded from Java 8 to Java 21, the latest LTS supported by the
// Spring Boot 3.2.x baseline.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.amazonaws:aws-java-sdk:1.12.788'
    // Joda-Time is superseded by java.time but still used by application
    // code; commons-lang 2.x has been replaced by commons-lang3.
    implementation 'joda-time:joda-time:2.12.7'
    implementation 'org.apache.commons:commons-lang3:3.18.0'
}
