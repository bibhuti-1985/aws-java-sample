plugins {
    // Pinned to Spring Boot 2.7.x (OSS-EOL since Nov 2023) so AWS Transform's
    // managed Spring Boot upgrade (2.x -> 3.x) is detected as an applicable
    // transformation.
    id 'org.springframework.boot' version '2.7.18'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
    id 'java'
    id 'application'
}

application {
    mainClass = "com.amazonaws.samples.S3Sample"
}

springBoot {
    mainClass = "com.amazonaws.samples.OrderServiceApplication"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('com.fasterxml.jackson:jackson-bom:2.18.11')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.amazonaws:aws-java-sdk:1.12.788'
    // Modernized from the original tech-debt baseline: joda-time updated
    // (still used by the sample code) and commons-lang 2.x replaced by
    // its successor commons-lang3.
    implementation 'joda-time:joda-time:2.13.0'
    implementation 'org.apache.commons:commons-lang3:3.18.0'
}
