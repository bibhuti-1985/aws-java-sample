plugins {
    // Spring Boot 3.2.x (LTS line) replaces the EOL 2.7.x baseline and is
    // required for Java 17+/21 support.
    id 'org.springframework.boot' version '3.2.12'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'java'
    id 'application'
}

mainClassName = "com.amazonaws.samples.S3Sample"

springBoot {
    mainClass = "com.amazonaws.samples.OrderServiceApplication"
}

// Upgraded to the latest widely supported LTS release (Java 21).
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.amazonaws:aws-java-sdk:1.12.797'
    // Dependencies below were intentionally old to illustrate the tech debt that
    // AWS Transform's continuous modernization flow addresses.
    implementation 'joda-time:joda-time:2.15.0'
    implementation 'org.apache.commons:commons-lang3:3.21.0'
}
