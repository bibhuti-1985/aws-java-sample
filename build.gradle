plugins {
    // Spring Boot 3.2.12 (LTS) - upgraded from the EOL 2.7.x line as part of
    // the Java version upgrade, since Spring Boot 3.x is required to run on
    // Java 17+/21.
    id 'org.springframework.boot' version '3.2.12'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'java'
    id 'application'
}

application {
    mainClass = "com.amazonaws.samples.S3Sample"
}

springBoot {
    mainClass = "com.amazonaws.samples.OrderServiceApplication"
}

// Java 21, the current Java LTS release.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.amazonaws:aws-java-sdk:1.12.788'
    // Intentionally old dependencies to illustrate the tech debt that
    // AWS Transform's continuous modernization flow addresses.
    // Java 21 upgrade note: deliberately not updated — both are Java 21
    // compatible, and replacing them requires API migrations (java.time,
    // commons-lang3) outside the scope of a runtime version upgrade.
    implementation 'joda-time:joda-time:2.3'
    implementation 'commons-lang:commons-lang:2.6'
}
